<!DOCTYPE html>
<html lang="bn">
<head>

<title>Technology Quiz - Knowledge World</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f1f5f9;
    color:#0f172a;
}

header{
    background:linear-gradient(135deg,#0f766e,#2563eb);
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{margin:0 0 8px;font-size:30px}
header p{margin:0}

.container{
    max-width:700px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{display:none}

.option{
    display:block;
    padding:15px;
    margin:12px 0;
    border:2px solid #e2e8f0;
    border-radius:12px;
    cursor:pointer;
    font-size:17px;
}

.option input{margin-right:10px}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.start-btn{background:#2563eb;color:white}
.next-btn{background:#16a34a;color:white}
.submit-btn{background:#dc2626;color:white}
.restart-btn{background:#7c3aed;color:white}
.home-btn{background:#475569;color:white}

.progress{
    color:#64748b;
    font-weight:bold;
    margin-bottom:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.result-box{text-align:center}

.result-number{
    font-size:42px;
    font-weight:bold;
    color:#2563eb;
}

.feedback{
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-weight:bold;
}

.correct{
    background:#dcfce7;
    color:#166534;
}

.wrong{
    background:#fee2e2;
    color:#991b1b;
}

label{
    display:block;
    margin:10px 0;
    font-size:17px;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}
</style>
</head>

<body>

<header>
<h1>💻 Technology Quiz</h1>
<p>Knowledge World</p>
</header>

<div class="container">

<div id="startScreen" class="card">

<h2>🧠 Technology Quiz শুরু করুন</h2>

<p>
এখানে মোট <b>৫০টি প্রশ্ন</b> আছে।
আপনি যতগুলো প্রশ্ন জানেন, ততগুলো উত্তর দিতে পারেন।
</p>

<hr>

<h3>Negative Marking</h3>

<label>
<input type="radio" name="negative" value="yes" checked>
হ্যাঁ — ভুল উত্তরের জন্য -0.25
</label>

<label>
<input type="radio" name="negative" value="no">
না — ভুল উত্তরের জন্য কোনো নম্বর কাটা হবে না
</label>

<br>

<button class="start-btn" onclick="startQuiz()">
🚀 Quiz শুরু করুন
</button>

<br>

<button class="home-btn" onclick="goHome()">
🏠 Quiz Dashboard
</button>

</div>


<div id="quizScreen" class="card hidden">

<div class="progress" id="progress"></div>

<h2 id="question"></h2>

<div id="options"></div>

<div id="feedback"></div>

<br>

<button class="next-btn" onclick="nextQuestion()">
পরের প্রশ্ন →
</button>

<button class="submit-btn" onclick="submitQuiz()">
🏁 Quiz Submit
</button>

</div>


<div id="resultScreen" class="card hidden">

<div class="result-box">

<h2>🎉 Quiz শেষ!</h2>

<p>আপনার Score</p>

<div class="result-number" id="score"></div>

<div class="stats">

<div class="stat">
<b>✅ সঠিক</b>
<div id="correctCount">0</div>
</div>

<div class="stat">
<b>❌ ভুল</b>
<div id="wrongCount">0</div>
</div>

<div class="stat">
<b>⭕ উত্তর দেওয়া হয়নি</b>
<div id="unansweredCount">0</div>
</div>

<div class="stat">
<b>📚 মোট প্রশ্ন</b>
<div>50</div>
</div>

</div>

<button class="restart-btn" onclick="restartQuiz()">
🔄 আবার শুরু করুন
</button>

<button class="home-btn" onclick="goHome()">
🏠 Quiz Dashboard
</button>

</div>
</div>

</div>

<footer>
© Knowledge World | তৈরি করেছেন ইয়াছিন
</footer>

        options: [

let currentQuestion = 0;
let answers = [];
let negativeMarking = true;


function startQuiz() {

    negativeMarking =
        document.querySelector(
            'input[name="negative"]:checked'
        ).value === "yes";

    currentQuestion = 0;

    answers = new Array(questions.length).fill(null);

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("quizScreen")
        .classList.remove("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    showQuestion();
}


function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "প্রশ্ন " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    document.getElementById("question").innerText = q.q;

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach(function(option, index) {

        const label =
            document.createElement("label");

        label.className = "option";

        label.innerHTML =
            '<input type="radio" name="answer" value="' +
            index +
            '">' +
            option;

        optionsDiv.appendChild(label);
    });

    document.getElementById("feedback").innerHTML = "";
}


function nextQuestion() {

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );

    if (selected) {

        answers[currentQuestion] =
            Number(selected.value);

    } else {

        answers[currentQuestion] = null;
    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();

    } else {

        submitQuiz();
    }
}


function submitQuiz() {

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );

    if (
        selected &&
        answers[currentQuestion] === null
    ) {
        answers[currentQuestion] =
            Number(selected.value);
    }


    let correct = 0;
    let wrong = 0;
    let unanswered = 0;


    answers.forEach(function(answer, index) {

        if (answer === null) {

            unanswered++;

        } else if (
            answer === questions[index].answer
        ) {

            correct++;

        } else {

            wrong++;
        }
    });


    let score = correct;

    if (negativeMarking) {

        score =
            correct - (wrong * 0.25);
    }


    score =
        Math.round(score * 100) / 100;


    document.getElementById("quizScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");


    document.getElementById("score").innerText =
        score;

    document.getElementById("correctCount").innerText =
        correct;

    document.getElementById("wrongCount").innerText =
        wrong;

    document.getElementById("unansweredCount").innerText =
        unanswered;
}


function restartQuiz() {

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("startScreen")
        .classList.remove("hidden");
}


function goHome() {

    window.location.href = "quiz.html";
}

</script>
