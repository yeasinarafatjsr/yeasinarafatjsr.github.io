<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Article - Knowledge World</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #333;
        }

        header {
            background: #172554;
            color: white;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .home-btn {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 9px 15px;
            border-radius: 7px;
            font-size: 14px;
        }

        .article-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .article {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .article-category {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .article h2 {
            color: #172554;
            font-size: 30px;
            line-height: 1.35;
            margin: 0 0 10px;
        }

        .article-date {
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .article-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 22px;
        }

        .article-content {
            color: #333;
            font-size: 17px;
            line-height: 1.9;
            white-space: pre-line;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: white;
            background: #172554;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #dc2626;
        }

        @media (max-width: 600px) {

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .article {
                padding: 18px;
            }

            .article h2 {
                font-size: 24px;
            }

            .article-content {
                font-size: 16px;
                line-height: 1.8;
            }

        }
.article-interactions{
    margin-top:30px;
    padding-top:25px;
    border-top:1px solid #e5e7eb;
}

.article-interactions h3{
    color:#172554;
    margin:0 0 15px;
    font-size:20px;
}

.reaction-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.reaction-buttons button,
.share-buttons button{
    border:1px solid #d1d5db;
    background:#fff;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.reaction-buttons button:hover,
.share-buttons button:hover{
    background:#eff6ff;
    border-color:#2563eb;
}

.reaction-buttons button b{
    margin-left:4px;
    color:#2563eb;
}

.share-section{
    margin-top:30px;
}

.share-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.comments-section{
    margin-top:30px;
}

#commentName,
#commentText{
    width:100%;
    padding:11px;
    margin-bottom:10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
}

#commentText{
    resize:vertical;
}

#commentBtn{
    border:none;
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#commentBtn:hover{
    background:#1d4ed8;
}

#commentMessage{
    margin-top:10px;
    font-size:14px;
}

#commentsList{
    margin-top:20px;
}

.comment-item{
    background:#f8fafc;
    padding:13px;
    margin-top:10px;
    border-radius:9px;
    border-left:3px solid #2563eb;
}

.comment-name{
    font-weight:bold;
    color:#172554;
}

.comment-date{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.comment-text{
    margin-top:7px;
    line-height:1.6;
}

@media(max-width:600px){
    .reaction-buttons button,
    .share-buttons button{
        padding:8px 11px;
        font-size:13px;
    }
}
        .more-comments-btn{
    display:block;
    margin:18px auto 0;
    padding:10px 20px;
    border:1px solid #2563eb;
    background:white;
    color:#2563eb;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.more-comments-btn:hover{
    background:#2563eb;
    color:white;
}
    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <h1>🌍 Knowledge World</h1>

        <a href="index.html"
           class="home-btn">
            🏠 Home
        </a>

    </div>

</header>


<main class="article-container">

    <div id="articleBox"
         class="loading">

        সংবাদ লোড হচ্ছে...

    </div>

</main>


<script>

const SUPABASE_URL =
    "https://jwoajgfajojvyqrxxxen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_CxG0qxqT2-AtiH8w48GDsw_eJEvgQOF";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    function getVisitorId(){

    let visitorId=localStorage.getItem("kw_visitor_id");

    if(!visitorId){

        visitorId=
            "visitor_"+Date.now()+"_"+Math.random().toString(36).substring(2,12);

        localStorage.setItem("kw_visitor_id",visitorId);
    }

    return visitorId;
}


async function loadArticle() {

    const articleBox =
        document.getElementById("articleBox");


    const params =
        new URLSearchParams(
            window.location.search
        );


    const title =
        params.get("title");


    if (!title) {

        articleBox.className =
            "error";

        articleBox.innerHTML =
            "❌ কোনো Article নির্বাচন করা হয়নি।";

        return;

    }


    const { data, error } =
        await supabaseClient
        .from("articles")
        .select(
            "title, content, category, created_at, image_url,video_url"
        )
        .eq("title", title)
        .single();


    if (error || !data) {

        console.error(error);

        articleBox.className =
            "error";

        articleBox.innerHTML =
            "❌ Article পাওয়া যায়নি।";

        return;

    }


    articleBox.className =
        "article";


    let imageHTML = "";


    if (data.image_url) {

        imageHTML = `
            <img
                src="${data.image_url}"
                alt="${escapeHTML(data.title)}"
                class="article-image"
            >
        `;

    }


    const date =
        new Date(data.created_at)
        .toLocaleString("bn-BD", {
            dateStyle: "full",
            timeStyle: "short"
        });


    articleBox.innerHTML = `

        <span class="article-category">
            ${escapeHTML(data.category || "সাধারণ")}
        </span>

        <h2>
            ${escapeHTML(data.title)}
        </h2>

        <div class="article-date">
            🕐 ${date}
        </div>

        ${imageHTML}

        <div class="article-content">
    ${escapeHTML(data.content || "")}
</div>

${data.video_url ? `
    <div class="article-video">
        <iframe
            src="${getYouTubeEmbedUrl(data.video_url) || data.video_url}"
            title="Article Video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
` : ""}
<div class="article-interactions">

    <div class="reaction-section">

        <h3>আপনার প্রতিক্রিয়া</h3>

        <div class="reaction-buttons">

            <button data-reaction="like">
                👍 <span>Like</span>
                <b>0</b>
            </button>

            <button data-reaction="dislike">
                👎 <span>Dislike</span>
                <b>0</b>
            </button>

            <button data-reaction="love">
                ❤️ <span>Love</span>
                <b>0</b>
            </button>

            <button data-reaction="haha">
                😂 <span>Haha</span>
                <b>0</b>
            </button>

            <button data-reaction="wow">
                😮 <span>Wow</span>
                <b>0</b>
            </button>

            <button data-reaction="sad">
                😢 <span>Sad</span>
                <b>0</b>
            </button>

        </div>

    </div>


    <div class="share-section">

        <h3>📤 শেয়ার করুন</h3>

        <div class="share-buttons">

            <button id="nativeShareBtn">
                📤 Share
            </button>

            <button id="copyLinkBtn">
                🔗 Copy Link
            </button>

        </div>

    </div>


    <div class="comments-section">

        <h3>💬 Comments</h3>

        <input
            type="text"
            id="commentName"
            placeholder="আপনার নাম"
        >

        <textarea
            id="commentText"
            placeholder="আপনার মন্তব্য লিখুন..."
            rows="4">
        </textarea>

        <button id="commentBtn">
            💬 Comment করুন
        </button>

        <div id="commentMessage"></div>

        <div id="commentsList">
            মন্তব্য লোড হচ্ছে...
        </div>

    </div>

</div>
<a href="index.html"
   class="back-btn">
    ← Home-এ ফিরে যান
</a>

    `;
setupInteractions(data.title);
    async function setupInteractions(articleTitle){

    // =========================
    // Reactions
    // =========================

    async function loadReactions(){

        const {data,error}=await supabaseClient
            .from("reactions")
            .select("reaction")
            .eq("article_title",articleTitle);

        if(error){
            console.error(error);
            return;
        }

        const counts={
            like:0,
            dislike:0,
            love:0,
            haha:0,
            wow:0,
            sad:0
        };

        (data || []).forEach(item=>{
            if(counts[item.reaction] !== undefined){
                counts[item.reaction]++;
            }
        });

        document.querySelectorAll(".reaction-buttons button").forEach(button=>{

            const type=button.dataset.reaction;
            const countElement=button.querySelector("b");

            if(countElement){
                countElement.textContent=counts[type] || 0;
            }

        });
    }


    document.querySelectorAll(".reaction-buttons button").forEach(button=>{

        button.addEventListener("click",async function(){

            const reaction=this.dataset.reaction;

            this.disabled=true;

            const {error}=await supabaseClient
                .from("reactions")
                .insert({
                    article_title:articleTitle,
                    reaction:reaction
                });

            if(error){

                console.error(error);
                alert("❌ Reaction দেওয়া যায়নি।");

            }else{

                await loadReactions();

            }

            this.disabled=false;

        });

    });


    await loadReactions();


    // =========================
    // Comments
    // =========================

async function loadComments(showAll=false){

    const commentsList=document.getElementById("commentsList");

    commentsList.innerHTML="মন্তব্য লোড হচ্ছে...";

    const {data,error}=await supabaseClient
        .from("comments")
        .select("id, name, comment, created_at, visitor_id")
        .eq("article_title",articleTitle)
        .eq("is_hidden",false)
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);
        commentsList.innerHTML="❌ মন্তব্য লোড করা যাচ্ছে না।";
        return;

    }

    if(!data || data.length===0){

        commentsList.innerHTML="এখনো কোনো মন্তব্য নেই।";
        return;

    }

    commentsList.innerHTML="";

    const commentsToShow=showAll ? data : data.slice(0,5);

    commentsToShow.forEach(item=>{

        const commentBox=document.createElement("div");
        commentBox.className="comment-item";

        const name=document.createElement("div");
        name.className="comment-name";
        name.textContent=item.name;

        const date=document.createElement("div");
        date.className="comment-date";
        date.textContent=
            "🕐 "+new Date(item.created_at).toLocaleString("bn-BD");

        const text=document.createElement("div");
        text.className="comment-text";
        text.textContent=item.comment;

        commentBox.appendChild(name);
        commentBox.appendChild(date);
        commentBox.appendChild(text);

        commentsList.appendChild(commentBox);

    });


    // ৫টির বেশি Comment থাকলে "আরও দেখুন" দেখাবে
    if(data.length > 5 && !showAll){

        const moreButton=document.createElement("button");

        moreButton.textContent="আরও দেখুন →";
        moreButton.className="more-comments-btn";

        moreButton.addEventListener("click",function(){

            loadComments(true);

        });

        commentsList.appendChild(moreButton);

    }

}


    // =========================
    // Comment Submit
    // =========================

    document.getElementById("commentBtn").addEventListener("click",async function(){

        const nameInput=document.getElementById("commentName");
        const textInput=document.getElementById("commentText");
        const message=document.getElementById("commentMessage");
        const visitorId=getVisitorId();

        const name=nameInput.value.trim();
        const comment=textInput.value.trim();
        const {data:existingComment,error:checkError}=await supabaseClient
    .from("comments")
    .select("id")
    .eq("article_title",articleTitle)
    .eq("visitor_id",visitorId)
    .maybeSingle();

if(checkError){
    console.error(checkError);
    message.textContent="❌ Comment যাচাই করা যাচ্ছে না।";
    return;
}

if(existingComment){
    message.textContent="⚠️ আপনি এই Article-এ ইতিমধ্যে Comment করেছেন।";
    return;
}


        // নাম অবশ্যই দিতে হবে
        if(!name){

            message.textContent="⚠️ মন্তব্য করার আগে আপনার নাম লিখুন।";
            nameInput.focus();
            return;

        }


        // মন্তব্য অবশ্যই দিতে হবে
        if(!comment){

            message.textContent="⚠️ আপনার মন্তব্য লিখুন।";
            textInput.focus();
            return;

        }


        this.disabled=true;

        message.textContent="মন্তব্য পাঠানো হচ্ছে...";


        const {error}=await supabaseClient
            .from("comments")
            .insert({
                article_title:articleTitle,
                name:name,
                comment:comment
                visitor_id : visitorId
            });


        if(error){

            console.error(error);

            message.textContent=
                "❌ মন্তব্য পাঠানো যায়নি। আবার চেষ্টা করুন।";

        }else{

            message.textContent=
                "✅ মন্তব্য সফলভাবে যোগ হয়েছে।";

            nameInput.value="";
            textInput.value="";

            await loadComments();

        }

        this.disabled=false;

    });


    await loadComments();


    // =========================
    // Share
    // =========================

    document.getElementById("nativeShareBtn").addEventListener("click",async function(){

        const shareData={
            title:articleTitle,
            text:articleTitle,
            url:window.location.href
        };


        if(navigator.share){

            try{

                await navigator.share(shareData);

            }catch(error){

                console.log("Share cancelled");

            }

        }else{

            try{

                await navigator.clipboard.writeText(window.location.href);

                alert("🔗 Article link কপি হয়েছে।");

            }catch(error){

                alert("❌ Link কপি করা যায়নি।");

            }

        }

    });


    // =========================
    // Copy Link
    // =========================

    document.getElementById("copyLinkBtn").addEventListener("click",async function(){

        try{

            await navigator.clipboard.writeText(window.location.href);

            this.textContent="✅ Link Copied!";

            setTimeout(()=>{

                this.textContent="🔗 Copy Link";

            },2000);

        }catch(error){

            alert("❌ Link কপি করা যায়নি।");

        }

    });

}
}


function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
function getYouTubeEmbedUrl(url) {

    try {

        const parsed =
            new URL(url);

        if (
            parsed.hostname.includes("youtube.com")
        ) {

            const videoId =
                parsed.searchParams.get("v");

            if (videoId) {
                return "https://www.youtube.com/embed/" + videoId;
            }
        }

        if (
            parsed.hostname === "youtu.be"
        ) {

            const videoId =
                parsed.pathname.substring(1);

            if (videoId) {
                return "https://www.youtube.com/embed/" + videoId;
            }
        }

    } catch (error) {

        return null;
    }

    return null;
}

document.addEventListener(
    "DOMContentLoaded",
    loadArticle
);

</script>


</body>

</html>
