<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Knowledge World</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #333;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
        }

        .header-inner {
            max-width: 850px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .home-btn,
        .logout-btn {
            border: none;
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .home-btn {
            background: #2563eb;
        }

        .logout-btn {
            background: #dc2626;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .panel h2 {
            color: #172554;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            color: #172554;
            margin: 18px 0 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        .publish-btn {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .publish-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        #adminPanel {
            display: none;
        }

        #loginPanel {
            max-width: 500px;
            margin: 50px auto;
        }

        .admin-article-item {
            background: white;
            padding: 15px;
            margin-top: 12px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .admin-article-title {
            color: #172554;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .admin-article-info {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .admin-article-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .edit-btn:hover {
            background: #bfdbfe;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .cancel-edit-btn {
            margin-top: 10px;
            padding: 9px 16px;
            border: none;
            border-radius: 7px;
            background: #e5e7eb;
            color: #374151;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>🛠️ Knowledge World Admin</h1>
        <div>
            <a href="index.html" class="home-btn">🏠 Home</a>
            <button id="logoutBtn" class="logout-btn" style="display:none;">Logout</button>
        </div>
    </div>
</header>

<main class="container">

    <!-- LOGIN -->
    <section id="loginPanel" class="panel">
        <h2>🔐 Admin Login</h2>
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Admin email">

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password">

        <button id="loginBtn" class="publish-btn">Login</button>
        <div id="loginMessage" class="message"></div>
    </section>

    <!-- ADMIN PANEL -->
    <section id="adminPanel" class="panel">
        <h2>📰 নতুন Article প্রকাশ করুন</h2>

        <label>শিরোনাম</label>
        <input type="text" id="title" placeholder="সংবাদের শিরোনাম লিখুন">

        <label>Category</label>
        <select id="category">
            <option value="সাধারণ জ্ঞান">সাধারণ জ্ঞান</option>
            <option value="বিজ্ঞান">বিজ্ঞান</option>
            <option value="প্রযুক্তি">প্রযুক্তি</option>
            <option value="মহাকাশ">মহাকাশ</option>
            <option value="ইতিহাস">ইতিহাস</option>
            <option value="ভূগোল">ভূগোল</option>
        </select>

        <label>Image URL</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">

        <label>Video URL (ঐচ্ছিক)</label>
        <input type="url" id="videoUrl" placeholder="YouTube ভিডিও লিংক দিন">

        <label>Article Content</label>
        <textarea id="content" placeholder="এখানে পুরো সংবাদ লিখুন..."></textarea>

        <button id="publishBtn" class="publish-btn">🚀 Publish Article</button>
        <button type="button" id="cancelEditBtn" class="cancel-edit-btn" style="display:none;">❌ Cancel Edit</button>

        <div id="publishMessage" class="message"></div>

        <hr style="margin-top: 30px;">

        <h2>📰 প্রকাশিত Article</h2>
        <div id="adminArticlesList">Article লোড হচ্ছে...</div>
    </section>

</main>

<script>
    const SUPABASE_URL = "https://jwoajgfajojvyqrxxxen.supabase.co";
    const SUPABASE_KEY = "sb_publishable_CxG0qxqT2-AtiH8w48GDsw_eJEvgQOF";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const logoutBtn = document.getElementById("logoutBtn");

    let editingArticleTitle = null;

    function showMessage(element, text, type) {
        element.textContent = text;
        element.className = "message " + type;
    }

    async function checkUser() {
        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {
            loginPanel.style.display = "none";
            adminPanel.style.display = "block";
            logoutBtn.style.display = "inline-block";
            loadAdminArticles(); // অ্যাডমিন প্যানেল দৃশ্যমান হলেই আর্টিকেল লোড হবে
        } else {
            loginPanel.style.display = "block";
            adminPanel.style.display = "none";
            logoutBtn.style.display = "none";
        }
    }

    document.getElementById("loginBtn").addEventListener("click", async function() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        const message = document.getElementById("loginMessage");

        if (!email || !password) {
            showMessage(message, "Email এবং Password দিন।", "error");
            return;
        }

        const { error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            console.error(error);
            showMessage(message, "❌ Login করা যায়নি। Email অথবা Password ঠিক আছে কি না দেখুন।", "error");
            return;
        }

        showMessage(message, "✅ Login সফল হয়েছে।", "success");
        checkUser();
    });

    logoutBtn.addEventListener("click", async function() {
        await supabaseClient.auth.signOut();
        checkUser();
    });

    document.getElementById("publishBtn").addEventListener("click", async function() {
        const title = document.getElementById("title").value.trim();
        const category = document.getElementById("category").value;
        const imageUrl = document.getElementById("imageUrl").value.trim();
        const videoUrl = document.getElementById("videoUrl").value.trim();
        const content = document.getElementById("content").value.trim();
        const message = document.getElementById("publishMessage");
        const button = document.getElementById("publishBtn");

        if (!title || !content) {
            showMessage(message, "❌ শিরোনাম এবং Article Content অবশ্যই দিতে হবে।", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "প্রসেস করা হচ্ছে...";

        const { data: userData } = await supabaseClient.auth.getUser();

        if (!userData.user) {
            showMessage(message, "❌ আগে Admin Login করুন।", "error");
            button.disabled = false;
            button.textContent = editingArticleTitle ? "💾 Save Changes" : "🚀 Publish Article";
            return;
        }

        let result;

        if (editingArticleTitle) {
            result = await supabaseClient
                .from("articles")
                .update({
                    title: title,
                    content: content,
                    category: category,
                    image_url: imageUrl || null,
                    video_url: videoUrl || null
                })
                .eq("title", editingArticleTitle);
        } else {
            result = await supabaseClient
                .from("articles")
                .insert({
                    title: title,
                    content: content,
                    category: category,
                    image_url: imageUrl || null,
                    video_url: videoUrl || null
                });
        }

        const error = result.error;

        if (error) {
            console.error(error);
            showMessage(
                message,
                editingArticleTitle
                    ? "❌ Article আপডেট করা যায়নি।"
                    : "❌ Article প্রকাশ করা যায়নি। একই শিরোনামের Article আগে থেকে আছে কি না দেখুন।",
                "error"
            );
        } else {
            showMessage(
                message,
                editingArticleTitle
                    ? "✅ Article সফলভাবে আপডেট হয়েছে!"
                    : "✅ Article সফলভাবে প্রকাশিত হয়েছে!",
                "success"
            );

            // ইনপুট রিসেট
            document.getElementById("title").value = "";
            document.getElementById("imageUrl").value = "";
            document.getElementById("videoUrl").value = "";
            document.getElementById("content").value = "";
            document.getElementById("cancelEditBtn").style.display = "none";

            editingArticleTitle = null;

            loadAdminArticles();
        }

        button.disabled = false;
        button.textContent = "🚀 Publish Article";
    });

    supabaseClient.auth.onAuthStateChange(function() {
        checkUser();
    });

    async function loadAdminArticles() {
        const box = document.getElementById("adminArticlesList");
        box.innerHTML = "Article লোড হচ্ছে...";

        const { data, error } = await supabaseClient
            .from("articles")
            .select("title, category, image_url, video_url, content, created_at")
            .order("created_at", { ascending: false });

        if (error) {
            console.error(error);
            box.innerHTML = "❌ Article লোড করা যাচ্ছে না।";
            return;
        }

        if (!data || data.length === 0) {
            box.innerHTML = "এখনো কোনো Article প্রকাশিত হয়নি।";
            return;
        }

        box.innerHTML = "";

        data.forEach(article => {
            const item = document.createElement("div");
            item.className = "admin-article-item";

            const title = document.createElement("div");
            title.className = "admin-article-title";
            title.textContent = article.title;

            const info = document.createElement("div");
            info.className = "admin-article-info";
            info.textContent = "📚 " + (article.category || "সাধারণ") + " • 🕐 " + new Date(article.created_at).toLocaleString("bn-BD");

            const actions = document.createElement("div");
            actions.className = "admin-article-actions";

            const editBtn = document.createElement("button");
            editBtn.className = "edit-btn";
            editBtn.textContent = "✏️ Edit";
            editBtn.onclick = function() {
                editArticle(article);
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "🗑️ Delete";
            deleteBtn.onclick = function() {
                deleteArticle(article.title);
            };

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);

            item.appendChild(title);
            item.appendChild(info);
            item.appendChild(actions);

            box.appendChild(item);
        });
    }

    function editArticle(article) {
        editingArticleTitle = article.title;

        document.getElementById("title").value = article.title || "";
        document.getElementById("category").value = article.category || "";
        document.getElementById("imageUrl").value = article.image_url || "";
        document.getElementById("videoUrl").value = article.video_url || "";
        document.getElementById("content").value = article.content || "";

        document.getElementById("publishBtn").textContent = "💾 Save Changes";
        document.getElementById("cancelEditBtn").style.display = "inline-block";

        showMessage(document.getElementById("publishMessage"), "✏️ Article Edit mode চালু হয়েছে।", "success");

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteArticle(title) {
        const confirmed = confirm("এই Article-টি কি সত্যিই Delete করতে চান?");
        if (!confirmed) return;

        const { error } = await supabaseClient
            .from("articles")
            .delete()
            .eq("title", title);

        if (error) {
            console.error(error);
            alert("❌ Article Delete করা যায়নি।");
            return;
        }

        alert("✅ Article Delete হয়েছে।");
        loadAdminArticles();
    }

    document.getElementById("cancelEditBtn").onclick = function() {
        editingArticleTitle = null;

        document.getElementById("title").value = "";
        document.getElementById("imageUrl").value = "";
        document.getElementById("videoUrl").value = "";
        document.getElementById("content").value = "";

        document.getElementById("publishBtn").textContent = "🚀 Publish Article";
        document.getElementById("cancelEditBtn").style.display = "none";
        document.getElementById("publishMessage").style.display = "none";
    };

    // ইনিশিয়াল রান
    checkUser();
</script>

</body>

</html>
