    <br>

</div>

answer:0
},

{
q:"এই ওয়েবসাইটের নাম কী?",
options:["Knowledge World","Science World","Quiz World","Knowledge Bangladesh"],
answer:0
},

{
q:"এই ওয়েবসাইট কে তৈরি করেছেন?",
options:["রহিম","করিম","ইয়াছিন","সুমন"],
answer:2
}

];


let currentQuestion = 0;
let answers = [];
let negativeMarking = true;


function startQuiz(){

    negativeMarking =
        document.querySelector('input[name="negative"]:checked').value === "yes";

    currentQuestion = 0;
    answers = new Array(questions.length).fill(null);

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");
    document.getElementById("resultScreen").classList.add("hidden");

    showQuestion();
}


function showQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "প্রশ্ন " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerText = q.q;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option,index)=>{

        const label = document.createElement("label");
        label.className = "option";

        label.innerHTML =
            '<input type="radio" name="answer" value="' + index + '">' +
            option;

        optionsDiv.appendChild(label);
    });

    document.getElementById("feedback").innerHTML = "";
}


function nextQuestion(){

    const selected =
        document.querySelector('input[name="answer"]:checked');

    if(selected){

        answers[currentQuestion] = Number(selected.value);

        const correct =
            answers[currentQuestion] === questions[currentQuestion].answer;

        if(correct){

            document.getElementById("feedback").innerHTML =
                '<div class="feedback correct">✅ সঠিক উত্তর!</div>';

        }else{

            document.getElementById("feedback").innerHTML =
                '<div class="feedback wrong">❌ ভুল উত্তর!</div>';
        }

    }else{

        answers[currentQuestion] = null;

        document.getElementById("feedback").innerHTML =
            '<div class="feedback">⭕ এই প্রশ্নটি উত্তর দেওয়া হয়নি।</div>';
    }


    if(currentQuestion < questions.length - 1){

        setTimeout(function(){

            currentQuestion++;
            showQuestion();

        },700);

    }else{

        setTimeout(function(){
            submitQuiz();
        },700);

    }
}


function submitQuiz(){

    const selected =
        document.querySelector('input[name="answer"]:checked');

    if(selected && answers[currentQuestion] === null){

        answers[currentQuestion] = Number(selected.value);

    }

    let correct = 0;
    let wrong = 0;
    let unanswered = 0;

    answers.forEach((answer,index)=>{

        if(answer === null){

            unanswered++;

        }else if(answer === questions[index].answer){

            correct++;

        }else{

            wrong++;
        }

    });


    let score = correct;

    if(negativeMarking){

        score = correct - (wrong * 0.25);

    }

    score = Math.round(score * 100) / 100;


    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");

    document.getElementById("score").innerText = score;

    document.getElementById("correctCount").innerText = correct;
    document.getElementById("wrongCount").innerText = wrong;
    document.getElementById("unansweredCount").innerText = unanswered;
}


function restartQuiz(){

    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.remove("hidden");

}


function goHome(){

    window.location.href = "quiz.html";

}

</script>
