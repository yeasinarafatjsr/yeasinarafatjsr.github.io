<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Articles - Knowledge World</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #333;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
        }

        .header-inner {
            max-width: 950px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .home-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 7px;
            font-size: 14px;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .page-title {
            color: #172554;
            border-bottom: 2px solid #172554;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .article-item {
            display: flex;
            gap: 16px;
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: 0.2s;
        }

        .article-item:hover {
            transform: translateY(-2px);
        }

        .article-image {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: #e5e7eb;
        }

        .article-info {
            flex: 1;
        }

        .article-info h2 {
            color: #172554;
            font-size: 20px;
            margin: 0 0 5px;
        }

        .article-date {
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .article-preview {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 600px) {

            .header-inner {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .article-image {
                width: 100px;
                height: 75px;
            }

            .article-info h2 {
                font-size: 17px;
            }

            .article-preview {
                font-size: 13px;
            }

        }
        .page-title-box {
    margin-bottom: 25px;
}

.page-title {
    color: #172554;
    font-size: 30px;
    margin-bottom: 6px;
}

.page-title-box p {
    color: #666;
    margin: 0;
}


.article-tools {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}


.article-tools input,
.article-tools select {
    padding: 13px 15px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    background: white;
}


.article-tools input {
    flex: 1;
}


.article-tools input:focus,
.article-tools select:focus {
    border-color: #2563eb;
}


.articles-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}


.article-item {
    display: flex;
    gap: 15px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.2s;
}


.article-item:hover {
    transform: translateY(-3px);
}


.article-image {
    width: 145px;
    height: 100px;
    object-fit: cover;
    border-radius: 9px;
    flex-shrink: 0;
    background: #e5e7eb;
}


.article-info {
    flex: 1;
}


.article-info h2 {
    color: #172554;
    font-size: 18px;
    margin: 0 0 5px;
}


.article-date {
    color: #777;
    font-size: 12px;
    margin-bottom: 6px;
}


.article-preview {
    color: #555;
    font-size: 14px;
    line-height: 1.5;
}


.pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 30px 0;
}


.pagination button {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    background: #e5e7eb;
    cursor: pointer;
    font-size: 14px;
}


.pagination button:hover {
    background: #dbeafe;
}


@media (max-width: 700px) {

    .articles-grid {
        grid-template-columns: 1fr;
    }

    .article-tools {
        flex-direction: column;
    }

    .article-image {
        width: 105px;
        height: 78px;
    }

    .article-info h2 {
        font-size: 16px;
    }

    .article-preview {
        font-size: 13px;
    }

}

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <h1>🌍 Knowledge World</h1>

        <a href="index.html"
           class="home-btn">
            🏠 Home
        </a>

    </div>

</header>


<main class="container">

    <div class="page-title-box">

        <h2 class="page-title">
            📰 সকল Article
        </h2>

        <p>
            Knowledge World-এর সকল প্রকাশিত সংবাদ ও জ্ঞানমূলক লেখা
        </p>

    </div>


    <div class="article-tools">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Article খুঁজুন..."
        >


        <select id="categoryFilter">

            <option value="all">
                📚 সকল বিষয়
            </option>

        </select>

    </div>


    <div id="articlesList"
         class="articles-grid">

        সংবাদ লোড হচ্ছে...

    </div>


    <div id="pagination"
         class="pagination">
    </div>

</main>


<script>

const SUPABASE_URL =
    "https://jwoajgfajojvyqrxxxen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_CxG0qxqT2-AtiH8w48GDsw_eJEvgQOF";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allArticles = [];
let currentPage = 1;
const articlesPerPage = 6;


async function loadArticles() {

    const box =
        document.getElementById("articlesList");

    box.innerHTML =
        "সংবাদ লোড হচ্ছে...";


    const { data, error } =
        await supabaseClient
        .from("articles")
        .select(
            "title, content, category, created_at, image_url, video_url"
        )
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        box.innerHTML =
            "❌ সংবাদ লোড করা যাচ্ছে না।";

        return;
    }


    if (!data || data.length === 0) {

        box.innerHTML =
            "এখনো কোনো Article প্রকাশিত হয়নি।";

        return;
    }


    allArticles = data;


    createCategoryOptions();

    displayArticles();
}


function createCategoryOptions() {

    const filter =
        document.getElementById("categoryFilter");


    const categories =
        [...new Set(
            allArticles
            .map(article => article.category)
            .filter(Boolean)
        )];


    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;

        option.textContent =
            category;

        filter.appendChild(option);

    });

}


function displayArticles() {

    const box =
        document.getElementById("articlesList");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const category =
        document.getElementById("categoryFilter")
        .value;


    const filtered =
        allArticles.filter(article => {

            const title =
                (article.title || "")
                .toLowerCase();

            const content =
                (article.content || "")
                .toLowerCase();


            const matchesSearch =
                title.includes(search) ||
                content.includes(search);


            const matchesCategory =
                category === "all" ||
                article.category === category;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    const totalPages =
        Math.ceil(
            filtered.length /
            articlesPerPage
        );


    if (currentPage > totalPages) {
        currentPage = 1;
    }


    const start =
        (currentPage - 1) *
        articlesPerPage;


    const end =
        start + articlesPerPage;


    const pageArticles =
        filtered.slice(start, end);


    box.innerHTML = "";


    if (pageArticles.length === 0) {

        box.innerHTML =
            "🔎 কোনো Article পাওয়া যায়নি।";

        document.getElementById(
            "pagination"
        ).innerHTML = "";

        return;
    }


    pageArticles.forEach(article => {

        const item =
            document.createElement("div");

        item.className =
            "article-item";


        item.onclick = function() {

            window.location.href =
                "article.html?title=" +
                encodeURIComponent(
                    article.title
                );

        };


        const image =
            document.createElement("img");

        image.className =
            "article-image";

        image.src =
            article.image_url ||
            "https://placehold.co/300x200?text=Knowledge+World";

        image.alt =
            article.title;


        const info =
            document.createElement("div");

        info.className =
            "article-info";


        const title =
            document.createElement("h2");

        title.textContent =
            article.title;


        const date =
            document.createElement("div");

        date.className =
            "article-date";

        date.textContent =
            "🕐 " +
            new Date(article.created_at)
            .toLocaleString("bn-BD", {
                dateStyle: "medium",
                timeStyle: "short"
            });


        const preview =
            document.createElement("div");

        preview.className =
            "article-preview";


        const text =
            article.content || "";


        preview.textContent =
            text.length > 140
            ? text.substring(0, 140) + "..."
            : text;


        info.appendChild(title);
        info.appendChild(date);
        info.appendChild(preview);

        item.appendChild(image);
        item.appendChild(info);

        box.appendChild(item);

    });


    createPagination(totalPages);
}


function createPagination(totalPages) {

    const pagination =
        document.getElementById(
            "pagination"
        );


    pagination.innerHTML = "";


    if (totalPages <= 1) {
        return;
    }


    for (
        let i = 1;
        i <= totalPages;
        i++
    ) {

        const button =
            document.createElement("button");

        button.textContent = i;


        if (i === currentPage) {
            button.style.fontWeight = "bold";
        }


        button.onclick = function() {

            currentPage = i;

            displayArticles();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


        pagination.appendChild(button);

    }

}


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function() {

        currentPage = 1;

        displayArticles();

    }
);


document.getElementById(
    "categoryFilter"
).addEventListener(
    "change",
    function() {

        currentPage = 1;

        displayArticles();

    }
);


document.addEventListener(
    "DOMContentLoaded",
    loadArticles
);

</script>


</body>

</html>
