<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Feature by Yeasin</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172554;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.advanced-box {
    margin-top: 40px;
    background: white;
    padding: 35px 25px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    text-align: center;
}

.advanced-box h1 {
    margin-bottom: 10px;
}

.advanced-box > p {
    color: #64748b;
    margin-bottom: 25px;
}

.video-input {
    width: 100%;
    padding: 15px;
    border: 2px solid #dbeafe;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    margin-bottom: 20px;
}

.video-input:focus {
    border-color: #2563eb;
}

.options {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.option-btn {
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    background: #172554;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.option-btn:hover {
    background: #2563eb;
}

.result {
    margin-top: 30px;
    padding: 20px;
    background: #f8fafc;
    border-radius: 12px;
    text-align: left;
    line-height: 1.7;
}

.success {
    color: #166534;
}

.error {
    color: #b91c1c;
}

</style>
</head>


<body>

<div class="container">

<div class="advanced-box">

<h1>🚀 Advanced Feature by Yeasin</h1>

<p>
ভিডিও লিংক দিন এবং আপনার প্রয়োজন অনুযায়ী
Summary, Notes অথবা Audio তৈরি করুন।
</p>


<input
    type="text"
    class="video-input"
    placeholder="🔗 এখানে ভিডিও লিংক দিন..."
>


<div class="options">

<button class="option-btn" data-type="summary">
📝 Summary
</button>

<button class="option-btn" data-type="notes">
📚 Notes
</button>

<button class="option-btn" data-type="audio">
🎧 Audio
</button>

</div>


<div class="result">

<h3>📄 Result</h3>

<p>
এখানে আপনার ফলাফল দেখা যাবে।
</p>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://jwoajgfajojvyqrxxxen.supabase.co";


const SUPABASE_KEY =
"sb_publishable_CxG0qxqT2-AtiH8w48GDsw_eJEvgQOF";


const videoInput =
document.querySelector(".video-input");

const result =
document.querySelector(".result");

const buttons =
document.querySelectorAll(".option-btn");


buttons.forEach(function(button) {

button.addEventListener("click", async function() {

const videoLink =
videoInput.value.trim();

const requestType =
button.dataset.type;


if (videoLink === "") {

result.innerHTML = `
<h3 class="error">⚠️ Video Link দিন</h3>
<p>প্রথমে একটি ভিডিওর লিংক দিন।</p>
`;

return;

}


buttons.forEach(function(btn) {
btn.disabled = true;
});


result.innerHTML = `
<h3>⏳ Processing...</h3>
<p>Request পাঠানো হচ্ছে...</p>
`;


try {

const response = await fetch(

SUPABASE_URL + "/rest/v1/ai_requests",

{

method: "POST",

headers: {

"Content-Type": "application/json",

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Prefer": "return=minimal"

},

body: JSON.stringify({

video_url: videoLink,

request_type: requestType

})

}

);


if (!response.ok) {

throw new Error(
"Supabase request failed"
);

}


let title = "";
let message = "";


if (requestType === "summary") {

title = "📝 Summary";

message =
"আপনার Summary request সফলভাবে সংরক্ষিত হয়েছে।";

}


if (requestType === "notes") {

title = "📚 Notes";

message =
"আপনার Notes request সফলভাবে সংরক্ষিত হয়েছে।";

}


if (requestType === "audio") {

title = "🎧 Audio";

message =
"আপনার Audio request সফলভাবে সংরক্ষিত হয়েছে।";

}


result.innerHTML = `

<h3 class="success">
✅ ${title}
</h3>

<p>${message}</p>

<br>

<p>
<strong>ভিডিও:</strong><br>
${videoLink}
</p>

`;

}

catch (error) {

result.innerHTML = `

<h3 class="error">
❌ সমস্যা হয়েছে
</h3>

<p>
Supabase-এর সাথে সংযোগ করা যায়নি।
</p>

`;

console.error(error);

}


buttons.forEach(function(btn) {
btn.disabled = false;
});

});

});

</script>

</body>
</html>
